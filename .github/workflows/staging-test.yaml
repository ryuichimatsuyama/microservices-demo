name: PR Environment Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify-pr-environment:
    name: Verify PR Environment
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # AWS authentication
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "${{ vars.EKS_CLUSTER_NAME }}"

      # ------------------------------------------------------------
      # Wait until ApplicationSet creates the PR Application
      # ------------------------------------------------------------
      - name: Wait for PR Application
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          APP="pr-${PR_NUMBER}"

          echo "Waiting for ${APP} to become Synced and Healthy..."

          for i in {1..60}; do
            if ! kubectl get application "$APP" -n argocd >/dev/null 2>&1; then
              echo "Attempt ${i}/60: Application not found yet."
              sleep 10
              continue
            fi

            SYNC=$(kubectl get application "$APP" -n argocd \
              -o jsonpath='{.status.sync.status}')

            HEALTH=$(kubectl get application "$APP" -n argocd \
              -o jsonpath='{.status.health.status}')

            echo "Attempt ${i}/60: sync=${SYNC}, health=${HEALTH}"

            if [[ "$SYNC" == "Synced" && "$HEALTH" == "Healthy" ]]; then
              echo "SUCCESS: ${APP} is Synced and Healthy."
              exit 0
            fi

            sleep 10
          done

          echo "ERROR: ${APP} did not become Synced and Healthy within 10 minutes."

          kubectl get application "$APP" -n argocd \
            -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status'

          exit 1
