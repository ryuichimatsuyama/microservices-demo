name: PR Environment Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify-pr-environment:
    name: Verify PR Environment
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # AWS authentication
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "${{ vars.EKS_CLUSTER_NAME }}"

      # ------------------------------------------------------------
      # Wait until ApplicationSet creates the PR Application
      # ------------------------------------------------------------
      - name: Wait for PR Application
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          APP="pr-${PR_NUMBER}"

          echo "Waiting for Argo CD Application: ${APP}"

          for i in {1..60}; do
            if kubectl get application "$APP" -n argocd >/dev/null 2>&1; then
              echo "Application ${APP} found."
              kubectl get application "$APP" \
                -n argocd \
                -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status'
              exit 0
            fi

            echo "Application ${APP} not found yet. Retrying..."
            sleep 10
          done

          echo "ERROR: Application ${APP} was not created within 10 minutes."
          exit 1

      # ------------------------------------------------------------
      # Argo CD CLI
      # ------------------------------------------------------------
      - name: Install Argo CD CLI
        env:
          ARGOCD_VERSION: v3.1.7
        run: |
          curl -sSL -o /tmp/argocd \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"

          sudo install -m 555 /tmp/argocd /usr/local/bin/argocd

          argocd version --client

      # ------------------------------------------------------------
      # Verify PR environment
      # ------------------------------------------------------------
      - name: Verify PR Application is Synced and Healthy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          APP="pr-${PR_NUMBER}"

          echo "Waiting for ${APP} to become Synced and Healthy..."

          argocd app wait "$APP" \
            --core \
            --app-namespace argocd \
            --sync \
            --health \
            --timeout 600

