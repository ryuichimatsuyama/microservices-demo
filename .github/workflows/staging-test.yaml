name: PR Environment Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify-pr-environment:
    name: Verify PR Environment
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # AWS authentication
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "${{ vars.EKS_CLUSTER_NAME }}"

      # ------------------------------------------------------------
      # Wait until ApplicationSet creates the PR Application
      # ------------------------------------------------------------
      - name: Wait for PR Application
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          APP="pr-${PR_NUMBER}"

          echo "Waiting for ${APP}"
          echo "Expected revision: ${EXPECTED_REVISION}"

          for i in {1..60}; do
            if ! kubectl get application "$APP" -n argocd >/dev/null 2>&1; then
              echo "Attempt ${i}/60: Application not found yet."
              sleep 10
              continue
            fi

            SYNC=$(kubectl get application "$APP" -n argocd \
              -o jsonpath='{.status.sync.status}')

            HEALTH=$(kubectl get application "$APP" -n argocd \
              -o jsonpath='{.status.health.status}')

            REVISION=$(kubectl get application "$APP" -n argocd \
              -o jsonpath='{.status.sync.revision}')

            echo "Attempt ${i}/60:"
            echo "  revision=${REVISION}"
            echo "  sync=${SYNC}"
            echo "  health=${HEALTH}"

            if [[ "$REVISION" == "$EXPECTED_REVISION" \
              && "$SYNC" == "Synced" \
              && "$HEALTH" == "Healthy" ]]; then

              echo "SUCCESS: ${APP} deployed expected PR revision."
              exit 0
            fi

            sleep 10
          done

          echo "ERROR: ${APP} did not deploy expected revision."

          kubectl get application "$APP" -n argocd \
            -o custom-columns='NAME:.metadata.name,REVISION:.status.sync.revision,SYNC:.status.sync.status,HEALTH:.status.health.status'

          exit 1

      - name: Smoke Test PR Frontend
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NAMESPACE="pr-${PR_NUMBER}"

          echo "Starting port-forward to frontend in ${NAMESPACE}..."

          kubectl port-forward \
            -n "${NAMESPACE}" \
            service/frontend \
            8080:80 \
            > /tmp/port-forward.log 2>&1 &

          PF_PID=$!

          cleanup() {
            echo "Stopping port-forward..."
            kill "${PF_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for frontend HTTP endpoint..."

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              http://127.0.0.1:8080/ \
              > /dev/null; then

              echo "SUCCESS: Frontend HTTP smoke test passed."
              exit 0
            fi

            echo "Attempt ${i}/30: frontend not reachable yet."
            sleep 5
          done

          echo "ERROR: Frontend HTTP smoke test failed."

          echo "=== Port-forward log ==="
          cat /tmp/port-forward.log || true

          echo "=== Frontend Service ==="
          kubectl get service frontend \
            -n "${NAMESPACE}" \
            -o wide || true

          echo "=== Frontend Pods ==="
          kubectl get pods \
            -n "${NAMESPACE}" \
            -l app=frontend \
            -o wide || true

          exit 1
