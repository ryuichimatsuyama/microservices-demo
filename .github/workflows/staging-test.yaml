name: PR Environment Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify-pr-environment:
    name: E2E - Purchase Flow
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # AWS authentication
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "${{ vars.EKS_CLUSTER_NAME }}"

      # ------------------------------------------------------------
      # Wait until ApplicationSet creates the PR Application
      # ------------------------------------------------------------
      - name: Wait for PR Application
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          APP="pr-${PR_NUMBER}"

          echo "Waiting for ${APP}"
          echo "Expected revision: ${EXPECTED_REVISION}"

          for i in {1..60}; do
            if ! kubectl get application "$APP" -n argocd >/dev/null 2>&1; then
              echo "Attempt ${i}/60: Application not found yet."
              sleep 10
              continue
            fi

            SYNC=$(kubectl get application "$APP" -n argocd \
              -o jsonpath='{.status.sync.status}')

            HEALTH=$(kubectl get application "$APP" -n argocd \
              -o jsonpath='{.status.health.status}')

            REVISION=$(kubectl get application "$APP" -n argocd \
              -o jsonpath='{.status.sync.revision}')

            echo "Attempt ${i}/60:"
            echo "  revision=${REVISION}"
            echo "  sync=${SYNC}"
            echo "  health=${HEALTH}"

            if [[ "$REVISION" == "$EXPECTED_REVISION" \
              && "$SYNC" == "Synced" \
              && "$HEALTH" == "Healthy" ]]; then

              echo "SUCCESS: ${APP} deployed expected PR revision."
              exit 0
            fi

            sleep 10
          done

          echo "ERROR: ${APP} did not deploy expected revision."

          kubectl get application "$APP" -n argocd \
            -o custom-columns='NAME:.metadata.name,REVISION:.status.sync.revision,SYNC:.status.sync.status,HEALTH:.status.health.status'

          exit 1

      - name: Smoke Test PR Application
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NAMESPACE="pr-${PR_NUMBER}"
          BASE_URL="http://127.0.0.1:8080"

          echo "Starting port-forward to frontend in ${NAMESPACE}..."

          kubectl port-forward \
            -n "${NAMESPACE}" \
            service/frontend \
            8080:80 \
            > /tmp/port-forward.log 2>&1 &

          PF_PID=$!

          cleanup() {
            echo "Stopping port-forward..."
            kill "${PF_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          # --------------------------------------------------
          # 1. Wait for frontend
          # --------------------------------------------------

          echo "Waiting for frontend..."

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              "${BASE_URL}/" \
              > /tmp/home.html; then

              echo "SUCCESS: Homepage is reachable."
              break
            fi

            if [[ "$i" == "30" ]]; then
              echo "ERROR: Homepage did not become reachable."
              cat /tmp/port-forward.log || true
              exit 1
            fi

            echo "Attempt ${i}/30: frontend not ready yet."
            sleep 5
          done

          # --------------------------------------------------
          # 2. Check homepage content
          # --------------------------------------------------

          echo "Checking homepage content..."

          if ! grep -q "Online Boutique" /tmp/home.html; then
            echo "ERROR: Expected homepage content was not found."
            exit 1
          fi

          echo "SUCCESS: Homepage content is valid."

          # --------------------------------------------------
          # 3. Product detail
          # --------------------------------------------------

          PRODUCT_ID="OLJCESPC7Z"

          echo "Testing product page: ${PRODUCT_ID}"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/product.html \
            --write-out "%{http_code}" \
            --max-time 10 \
            "${BASE_URL}/product/${PRODUCT_ID}")

          echo "Product page HTTP status: ${HTTP_CODE}"

          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "ERROR: Product page returned HTTP ${HTTP_CODE}."
            exit 1
          fi

          # --------------------------------------------------
          # 4. Validate product response
          # --------------------------------------------------

          if [[ ! -s /tmp/product.html ]]; then
            echo "ERROR: Product page returned an empty response."
            exit 1
          fi

          echo "SUCCESS: Product page returned valid content."
          echo "SUCCESS: Application smoke test passed."

          # --------------------------------------------------
          # 5. Add product to cart
          # --------------------------------------------------

          echo "Adding product to cart..."

          COOKIE_JAR="/tmp/cookies.txt"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --cookie-jar "${COOKIE_JAR}" \
            --cookie "${COOKIE_JAR}" \
            --output /tmp/add-cart.html \
            --write-out "%{http_code}" \
            --max-time 10 \
            --request POST \
            --data-urlencode "product_id=${PRODUCT_ID}" \
            --data-urlencode "quantity=1" \
            "${BASE_URL}/cart")

          echo "Add-to-cart HTTP status: ${HTTP_CODE}"

          if [[ "${HTTP_CODE}" != "200" && "${HTTP_CODE}" != "302" ]]; then
            echo "ERROR: Add-to-cart returned HTTP ${HTTP_CODE}."
            exit 1
          fi

          echo "SUCCESS: Product added to cart."

          # --------------------------------------------------
          # 6. Verify cart
          # --------------------------------------------------

          echo "Checking cart..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --cookie "${COOKIE_JAR}" \
            --output /tmp/cart.html \
            --write-out "%{http_code}" \
            --max-time 10 \
            "${BASE_URL}/cart")

          echo "Cart HTTP status: ${HTTP_CODE}"

          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "ERROR: Cart returned HTTP ${HTTP_CODE}."
            exit 1
          fi

          if ! grep -q "${PRODUCT_ID}" /tmp/cart.html; then
            echo "ERROR: Product ${PRODUCT_ID} was not found in cart."
            exit 1
          fi

          echo "SUCCESS: Product ${PRODUCT_ID} exists in cart."

          # --------------------------------------------------
          # 7. Checkout
          # --------------------------------------------------

          echo "Placing test order..."

          CURRENT_YEAR=$(date +%Y)
          EXPIRATION_YEAR=$((CURRENT_YEAR + 1))

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --cookie "${COOKIE_JAR}" \
            --cookie-jar "${COOKIE_JAR}" \
            --output /tmp/order.html \
            --write-out "%{http_code}" \
            --max-time 30 \
            --request POST \
            --data-urlencode "email=test@example.com" \
            --data-urlencode "street_address=123 Test Street" \
            --data-urlencode "zip_code=10001" \
            --data-urlencode "city=New York" \
            --data-urlencode "state=NY" \
            --data-urlencode "country=United States" \
            --data-urlencode "credit_card_number=4111111111111111" \
            --data-urlencode "credit_card_expiration_month=12" \
            --data-urlencode "credit_card_expiration_year=${EXPIRATION_YEAR}" \
            --data-urlencode "credit_card_cvv=123" \
            "${BASE_URL}/cart/checkout")

          echo "Checkout HTTP status: ${HTTP_CODE}"

          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "ERROR: Checkout returned HTTP ${HTTP_CODE}."

            echo "=== Checkout response ==="
            head -100 /tmp/order.html || true

            exit 1
          fi

          echo "SUCCESS: Checkout returned HTTP 200."

          # --------------------------------------------------
          # 8. Verify order confirmation
          # --------------------------------------------------

          echo "Verifying order confirmation..."

          if [[ ! -s /tmp/order.html ]]; then
            echo "ERROR: Checkout returned an empty response."
            exit 1
          fi

          # Order completion marker
          if ! grep -Fq "Your order is complete!" /tmp/order.html; then
            echo "ERROR: Order completion marker was not found."
            head -100 /tmp/order.html || true
            exit 1
          fi

          # Confirmation section
          if ! grep -Fq "Confirmation #" /tmp/order.html; then
            echo "ERROR: Confirmation number section was not found."
            exit 1
          fi

          # Tracking section
          if ! grep -Fq "Tracking #" /tmp/order.html; then
            echo "ERROR: Tracking number section was not found."
            exit 1
          fi

          # Payment summary
          if ! grep -Fq "THIS_SHOULD_NEVER_EXIST" /tmp/order.html; then
            echo "ERROR: Total Paid section was not found."
            exit 1
          fi

          echo "SUCCESS: Order confirmation page verified."
          echo "SUCCESS: End-to-end smoke test passed."

      # ------------------------------------------------------------
      # Collect diagnostics when E2E fails
      # ------------------------------------------------------------
      - name: Collect diagnostics
        if: failure()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NAMESPACE="pr-${PR_NUMBER}"
          DIAG_DIR="diagnostics"

          mkdir -p "${DIAG_DIR}/logs"
          mkdir -p "${DIAG_DIR}/previous-logs"

          echo "Collecting diagnostics from ${NAMESPACE}..."

          # --------------------------------------------------
          # Cluster / workload state
          # --------------------------------------------------

          kubectl get all \
            -n "${NAMESPACE}" \
            -o wide \
            > "${DIAG_DIR}/resources.txt" 2>&1 || true

          kubectl get pods \
            -n "${NAMESPACE}" \
            -o wide \
            > "${DIAG_DIR}/pods.txt" 2>&1 || true

          kubectl get events \
            -n "${NAMESPACE}" \
            --sort-by='.lastTimestamp' \
            > "${DIAG_DIR}/events.txt" 2>&1 || true

          kubectl describe pods \
            -n "${NAMESPACE}" \
            > "${DIAG_DIR}/pods-describe.txt" 2>&1 || true

          kubectl get application "pr-${PR_NUMBER}" \
            -n argocd \
            -o yaml \
            > "${DIAG_DIR}/argocd-application.yaml" 2>&1 || true

          kubectl describe application "pr-${PR_NUMBER}" \
            -n argocd \
            > "${DIAG_DIR}/argocd-application-describe.txt" 2>&1 || true

          # --------------------------------------------------
          # Current container logs
          # --------------------------------------------------

          while read -r pod; do
            POD_NAME="${pod#pod/}"

            echo "Collecting logs from ${POD_NAME}..."

            kubectl logs \
              -n "${NAMESPACE}" \
              "${POD_NAME}" \
              --all-containers=true \
              --timestamps=true \
              > "${DIAG_DIR}/logs/${POD_NAME}.log" 2>&1 || true

            # ------------------------------------------------
            # Previous logs (CrashLoopBackOff etc.)
            # ------------------------------------------------

            kubectl logs \
              -n "${NAMESPACE}" \
              "${POD_NAME}" \
              --all-containers=true \
              --previous \
              --timestamps=true \
              > "${DIAG_DIR}/previous-logs/${POD_NAME}.log" 2>&1 || true

          done < <(
            kubectl get pods \
              -n "${NAMESPACE}" \
              -o name
          )

          echo "Diagnostics collection completed."

      # ------------------------------------------------------------
      # Preserve diagnostics with the failed workflow
      # ------------------------------------------------------------
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-e2e-diagnostics
          path: diagnostics/
          retention-days: 7
          if-no-files-found: warn
