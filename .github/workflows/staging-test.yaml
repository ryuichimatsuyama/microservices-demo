name: PR Environment Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify-pr-environment:
    name: Verify PR Environment
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # AWS authentication
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "${{ vars.EKS_CLUSTER_NAME }}"

      # ------------------------------------------------------------
      # Wait until ApplicationSet creates the PR Application
      # ------------------------------------------------------------
      - name: Smoke Test PR Application
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NAMESPACE="pr-${PR_NUMBER}"
          BASE_URL="http://127.0.0.1:8080"

          echo "Starting port-forward to frontend in ${NAMESPACE}..."

          kubectl port-forward \
            -n "${NAMESPACE}" \
            service/frontend \
            8080:80 \
            > /tmp/port-forward.log 2>&1 &

          PF_PID=$!

          cleanup() {
            echo "Stopping port-forward..."
            kill "${PF_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          # --------------------------------------------------
          # 1. Wait for frontend
          # --------------------------------------------------

          echo "Waiting for frontend..."

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              "${BASE_URL}/" \
              > /tmp/home.html; then

              echo "SUCCESS: Homepage is reachable."
              break
            fi

            if [[ "$i" == "30" ]]; then
              echo "ERROR: Homepage did not become reachable."
              cat /tmp/port-forward.log || true
              exit 1
            fi

            echo "Attempt ${i}/30: frontend not ready yet."
            sleep 5
          done

          # --------------------------------------------------
          # 2. Check homepage content
          # --------------------------------------------------

          echo "Checking homepage content..."

          if ! grep -q "Online Boutique" /tmp/home.html; then
            echo "ERROR: Expected homepage content was not found."
            exit 1
          fi

          echo "SUCCESS: Homepage content is valid."

          # --------------------------------------------------
          # 3. Product detail
          # --------------------------------------------------

          PRODUCT_ID="OLJCESPC7Z"

          echo "Testing product page: ${PRODUCT_ID}"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/product.html \
            --write-out "%{http_code}" \
            --max-time 10 \
            "${BASE_URL}/product/${PRODUCT_ID}")

          echo "Product page HTTP status: ${HTTP_CODE}"

          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "ERROR: Product page returned HTTP ${HTTP_CODE}."
            exit 1
          fi

          # --------------------------------------------------
          # 4. Validate product response
          # --------------------------------------------------

          if [[ ! -s /tmp/product.html ]]; then
            echo "ERROR: Product page returned an empty response."
            exit 1
          fi

          echo "SUCCESS: Product page returned valid content."
          echo "SUCCESS: Application smoke test passed."
