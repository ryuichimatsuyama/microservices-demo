{{- if .Values.prEnvironment.enabled }}

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-smoke-test
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
    verbs:
      - get
      - list

  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

  - apiGroups: [""]
    resources:
      - pods/portforward
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-smoke-test
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: Group
    name: {{ .Values.prEnvironment.githubActionsGroup }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-smoke-test

{{- end }}
