{{- if and .Values.frontend.create .Values.frontend.slo.enabled }}

apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: {{ .Values.frontend.name }}-slo
  namespace: monitoring
  labels:
    release: monitoring

spec:
  service: {{ .Values.frontend.name }}

  labels:
    team: platform

  slos:
    - name: availability
      objective: {{ .Values.frontend.slo.objective }}
      description: "{{ .Values.frontend.name }} HTTP availability"

      sli:
        events:
          errorQuery: |
            (
              sum(rate(
                istio_requests_total{
                  reporter="destination",
                  destination_workload="{{ .Values.frontend.name }}",
                  request_protocol="http",
                  response_code=~"5.."
                }[{{ "{{.window}}" }}]
              ))
            ) or vector(0)

          totalQuery: |
            sum(rate(
              istio_requests_total{
                reporter="destination",
                destination_workload="{{ .Values.frontend.name }}",
                request_protocol="http"
              }[{{ "{{.window}}" }}]
            ))

      alerting:
        name: FrontendAvailability
        labels:
          category: availability

    - name: latency
      objective: {{ .Values.frontend.slo.latencyObjective }}
      description: "{{ .Values.frontend.name }} HTTP latency under {{ .Values.frontend.slo.latencyThresholdMs }}ms"

      sli:
        events:
          errorQuery: |
            (
              sum(rate(
                istio_request_duration_milliseconds_count{
                  reporter="destination",
                  destination_workload="{{ .Values.frontend.name }}",
                  request_protocol="http"
                }[{{ "{{.window}}" }}]
              ))
              -
              sum(rate(
                istio_request_duration_milliseconds_bucket{
                  reporter="destination",
                  destination_workload="{{ .Values.frontend.name }}",
                  request_protocol="http",
                  le="{{ .Values.frontend.slo.latencyThresholdMs }}"
                }[{{ "{{.window}}" }}]
              ))
            ) or vector(0)

          totalQuery: |
            sum(rate(
              istio_request_duration_milliseconds_count{
                reporter="destination",
                destination_workload="{{ .Values.frontend.name }}",
                request_protocol="http"
              }[{{ "{{.window}}" }}]
            ))

      alerting:
        name: FrontendLatency
        labels:
          category: latency

{{- end }}
